services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dogo
      POSTGRES_USER: dogo
      POSTGRES_PASSWORD: dogo
    ports:
      - "5432:5432"
    volumes:
      - dogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogo -d dogo"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dogo:dogo@db:5432/dogo
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dogo:dogo@db:5432/dogo
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  dogo_pgdata:
