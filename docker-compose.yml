services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dogo
      POSTGRES_USER: dogo
      POSTGRES_PASSWORD: dogo
    ports:
      - "5432:5432"
    volumes:
      - dogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogo -d dogo"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dogo:dogo@db:5432/dogo
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dogo:dogo@db:5432/dogo
      OSRM_BASE_URL: http://routing:5000
    ports:
      - "8000:8000"
    volumes:
      - dogo_verification_docs:/app/private_uploads/verification
    depends_on:
      migrate:
        condition: service_completed_successfully
  routing:
    image: osrm/osrm-backend:latest
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./data/maps:/data:ro
    ports:
      - "5000:5000"
volumes:
  dogo_pgdata:
  dogo_verification_docs:
